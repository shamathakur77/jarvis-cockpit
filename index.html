<style>
  :root {
    --sky-top: #2a1a4d;
    --sky-bottom: #12091f;
    --ink: #f4eefb;
    --ink-soft: #c9bde0;
    --sheet: rgba(34, 22, 66, 0.86);
    --line: rgba(244, 238, 251, 0.14);
    --earns: #5fe0d2;
    --soul: #f59bb4;
    --admin: #b7abd3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky-top: #2a1a4d; --sky-bottom: #12091f; }
  }
  :root[data-theme="dark"] { --sky-top: #2a1a4d; --sky-bottom: #12091f; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.55rem; font-weight: 500; letter-spacing: 0.01em; line-height: 1.1;
    margin: 0;
  }
  .title small { display: block; font-family: 'Manrope', sans-serif; font-size: 0.72rem; color: var(--ink-soft); margin-top: 4px; font-weight: 500; }
  .ar {
    pointer-events: auto; display: none;
    border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--ink);
    font: 600 0.78rem 'Manrope', sans-serif; padding: 9px 14px; border-radius: 999px; cursor: pointer;
  }
  .ar:focus-visible { outline: 2px solid var(--earns); outline-offset: 2px; }

  .now {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 74px);
    pointer-events: none; text-align: center; max-width: 88vw;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 0.82rem; line-height: 1.3; transition: opacity .4s;
  }
  .now b { font-weight: 600; display: block; }
  .now .tone { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 22px);
    text-align: center; font-size: 0.82rem; color: var(--ink-soft); pointer-events: none;
    transition: opacity .4s;
  }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--sheet); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    padding: 18px 22px calc(env(safe-area-inset-bottom) + 22px);
    transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    max-height: 40vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sheet h2 {
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 1.7rem; margin: 0; line-height: 1.05;
  }
  .sheet .count { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; }
  .sheet .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .sheet .sub { margin: 10px 0 0; font-size: .85rem; color: var(--ink-soft); }
  .sheet ul { list-style: none; padding: 0; margin: 14px 0 0; }
  .sheet li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 0.95rem; line-height: 1.35; }
  .sheet li:first-child { border-top: 0; }
  .close {
    position: absolute; top: 12px; right: 14px; border: 0; background: transparent; color: var(--ink-soft);
    font-size: 1.4rem; line-height: 1; padding: 6px 8px; cursor: pointer;
  }
  .close:focus-visible { outline: 2px solid var(--earns); border-radius: 6px; }

  body.record .hud, body.record .hint, body.record .now, body.record .sheet { opacity: 0 !important; pointer-events: none; }
  body.record::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 100vmax rgba(0,0,0,0);
  }
  .rec-tip { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: .8rem; color: var(--ink-soft); opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.record .rec-tip { opacity: 1; animation: fade 3s forwards; }
  @keyframes fade { 0%,60% { opacity: 1 } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .sheet { transition: none; }
  }
</style>

<body>
<div class="hud">
  <h1 class="title">Jarvis<small>10 clusters, 73 threads</small></h1>
  <button class="ar" id="arBtn" type="button">View in your room</button>
</div>
<div class="now" id="now" aria-live="polite"></div>
<div class="hint" id="hint">Tap an orb</div>
<div class="rec-tip">Recording view. Long-press anywhere to exit.</div>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="close" id="closeBtn" type="button" aria-label="Back">×</button>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <span class="count" id="sheetCount"></span>
  </div>
  <p class="sub" id="sheetSub">Tap a small orb to read its name. Tap empty space to go back.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) { document.getElementById('hint').textContent = 'The 3D library did not load. Check your connection and reload.'; return; }

  const CLUSTERS_FALLBACK = [
    { name: 'Products and builds', kind: 'earns', threads: ['VAYU', 'Restkollen', 'Pune Tree Map', 'DARPAN', 'DHVANI', 'Autonomous content', 'Morning brief', 'Care docs', 'ICA meal planner', 'Klädkollen', 'Kommunkollen', 'Yellow Pages', 'Frequency Brief', 'Family panchang card', 'Founder portfolio site', 'Wealth strategy tool', 'Wedding glam planner', 'Jarvis OS'] },
    { name: 'Spirituality and growth', kind: 'soul', threads: ['Vedic daily system', 'Couple kundali', 'Caste research', 'Manglik analysis', 'Scripture study', 'Peak productivity cycles', 'Human Design study', 'Numerology', 'Palmistry'] },
    { name: 'Career', kind: 'earns', threads: ['Auto-apply engine', 'FDE interviews', 'Telia AI Engineer', 'Curamando AI Engineer', 'Oakdale / Ikano', 'TCS AI Adoption Manager', 'Masters exploration', 'A-kassa'] },
    { name: 'Family and home', kind: 'soul', threads: ['Ivaan autism support and LSS', 'Couple self-care', 'Täby home', 'Sollentuna sale', 'Daily family brief', 'Chai Circle', 'Home systems', 'Debt payoff'] },
    { name: 'Civic tech and India', kind: 'soul', threads: ['Air watch', 'Mandi prices', 'Voter gap', 'School safety', 'Nashik city chart', 'India wealth layer', 'Newcomer safety net series'] },
    { name: 'Other threads', kind: 'admin', threads: ['Company with Aniket', 'Multi-AI orchestration', 'Stockholm style app', 'Work community', 'Power Couples System', 'Master life agent', 'Data exposure monitor'] },
    { name: 'Wealth and revenue', kind: 'earns', threads: ['Elite creator', 'India remote business', 'Sovereign by Source', 'Angel investing', 'Consulting audit', 'Shama OS income tracks'] },
    { name: 'Travel and lifestyle', kind: 'admin', threads: ['Croatia trip', 'Festive shopping', 'Nashik second home', 'Gym wear', 'India wedding trip Dec 2026'] },
    { name: 'Content and creator', kind: 'earns', threads: ['Instagram elite strategy', 'Autonomous content', 'Portfolio frequency page', 'Soul booklets'] },
    { name: 'Founder mode', kind: 'earns', threads: ['Norrsken House', 'Portfolio refresh', 'Investor scouting', 'HealthTech x Consciousness positioning'] },
  ];
  let CLUSTERS = CLUSTERS_FALLBACK;
  const COLORS = { earns: 0x5fe0d2, soul: 0xf59bb4, admin: 0xb7abd3 };
  const CSS = { earns: 'var(--earns)', soul: 'var(--soul)', admin: 'var(--admin)' };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function boot() {
  try {
    const r = await fetch('./clusters.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j) && j.length) CLUSTERS = j; }
  } catch (e) { /* offline or local file: keep fallback */ }
  const total_threads = CLUSTERS.reduce((a, c) => a + c.threads.length, 0);
  document.querySelector('.title small').textContent = CLUSTERS.length + ' clusters, ' + total_threads + ' threads';

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 100);
  camera.position.set(0, 0, 11);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.PointLight(0xffe6f2, 1.1, 40); key.position.set(4, 6, 6); scene.add(key);
  const rim = new THREE.PointLight(0x7fe7dc, 0.7, 40); rim.position.set(-6, -3, 4); scene.add(rim);

  // Group that holds the whole constellation (so AR can place it as one object)
  const world = new THREE.Group();
  scene.add(world);

  // Stars: soft, few, warm
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(600 * 3);
  for (let i = 0; i < 600; i++) {
    const r = 12 + Math.random() * 20;
    const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    starPos[i * 3] = r * Math.sin(p) * Math.cos(t);
    starPos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
    starPos[i * 3 + 2] = r * Math.cos(p);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xe9dcff, size: 0.06, transparent: true, opacity: 0.7 }));
  scene.add(stars);

  // Orbs on a golden spiral sphere layout
  const orbs = [];
  const total = CLUSTERS.length;
  const golden = Math.PI * (3 - Math.sqrt(5));
  CLUSTERS.forEach((c, i) => {
    const y = 1 - (i / (total - 1)) * 2;
    const rad = Math.sqrt(1 - y * y);
    const theta = golden * i;
    const R = 2.6;
    const pos = new THREE.Vector3(Math.cos(theta) * rad * R, y * R * 0.85, Math.sin(theta) * rad * R);
    const size = 0.28 + Math.sqrt(c.threads.length) * 0.11;

    const color = COLORS[c.kind];
    const mat = new THREE.MeshPhysicalMaterial({
      color, roughness: 0.25, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.2,
      emissive: color, emissiveIntensity: 0.28, transparent: true, opacity: 0.95
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 48, 48), mat);
    mesh.position.copy(pos.clone().multiplyScalar(6 + Math.random() * 6));
    mesh.scale.setScalar(0.01);
    mesh.userData = { cluster: c, base: pos.clone(), phase: Math.random() * Math.PI * 2, size, entering: true };
    world.add(mesh);

    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(size * 1.45, 32, 32),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.09, side: THREE.BackSide })
    );
    mesh.add(halo);
    orbs.push(mesh);
  });

  // Fine threads between clusters that feed each other
  const links = [[0, 6], [6, 3], [3, 1], [1, 8], [8, 6], [0, 8], [2, 6], [9, 0], [9, 6]];
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
  links.forEach(([a, b]) => {
    const g = new THREE.BufferGeometry().setFromPoints([orbs[a].userData.base, orbs[b].userData.base]);
    world.add(new THREE.Line(g, lineMat));
  });

  // Cosmic timing (port of Shama's cosmic-timing skill: NOAA sun + 8-segment table)
  const PLACES = { stockholm: [59.3293, 18.0686], nashik: [19.9975, 73.7898], pune: [18.5204, 73.8567] };
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  const place = tz === 'Asia/Kolkata' ? 'nashik' : 'stockholm';
  const [LAT, LON] = PLACES[place];

  function sunTimes(d) {
    // returns sunrise/sunset as minutes from local midnight (NOAA)
    const rad = Math.PI / 180;
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    const jdn = day + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    const tzOff = -d.getTimezoneOffset() / 60;
    function calc(rise) {
      let jd = jdn - 0.5 - tzOff / 24; // local midnight in UT
      let t = (jd - 2451545) / 36525;
      const pos = (t) => {
        const L0 = (280.46646 + t * (36000.76983 + t * 0.0003032)) % 360;
        const M = 357.52911 + t * (35999.05029 - 0.0001537 * t);
        const e = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
        const C = Math.sin(M * rad) * (1.914602 - t * (0.004817 + 0.000014 * t)) + Math.sin(2 * M * rad) * (0.019993 - 0.000101 * t) + Math.sin(3 * M * rad) * 0.000289;
        const trueLon = L0 + C;
        const omega = 125.04 - 1934.136 * t;
        const lam = trueLon - 0.00569 - 0.00478 * Math.sin(omega * rad);
        const eps0 = 23 + (26 + ((21.448 - t * (46.815 + t * (0.00059 - t * 0.001813)))) / 60) / 60;
        const eps = eps0 + 0.00256 * Math.cos(omega * rad);
        const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad)) / rad;
        const yv = Math.tan(eps * rad / 2) ** 2;
        const eot = 4 / rad * (yv * Math.sin(2 * L0 * rad) - 2 * e * Math.sin(M * rad) + 4 * e * yv * Math.sin(M * rad) * Math.cos(2 * L0 * rad) - 0.5 * yv * yv * Math.sin(4 * L0 * rad) - 1.25 * e * e * Math.sin(2 * M * rad));
        return { decl, eot };
      };
      const ha = (decl) => Math.acos(Math.cos(90.833 * rad) / (Math.cos(LAT * rad) * Math.cos(decl * rad)) - Math.tan(LAT * rad) * Math.tan(decl * rad)) / rad;
      let p = pos(t);
      let h = ha(p.decl);
      let ut = 720 - 4 * (LON + (rise ? h : -h)) - p.eot; // minutes UT
      // refine once at the event time
      t = (jd + ut / 1440 - 2451545) / 36525; p = pos(t); h = ha(p.decl);
      ut = 720 - 4 * (LON + (rise ? h : -h)) - p.eot;
      return ut + tzOff * 60;
    }
    return { sunrise: calc(true), sunset: calc(false) };
  }

  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const RAHU = { Sunday: 8, Monday: 2, Tuesday: 7, Wednesday: 5, Thursday: 6, Friday: 4, Saturday: 3 };
  const YAMA = { Sunday: 5, Monday: 4, Tuesday: 3, Wednesday: 2, Thursday: 1, Friday: 7, Saturday: 6 };
  const GULI = { Sunday: 7, Monday: 6, Tuesday: 5, Wednesday: 4, Thursday: 3, Friday: 2, Saturday: 1 };
  // Starting rule for which cluster the day lord favours. Adjust if it feels wrong.
  const DAY_CLUSTER = { Sunday: 'Founder mode', Monday: 'Family and home', Tuesday: 'Career', Wednesday: 'Products and builds', Thursday: 'Wealth and revenue', Friday: 'Content and creator', Saturday: 'Spirituality and growth' };
  const DAY_LORD = { Sunday: 'Sun', Monday: 'Moon', Tuesday: 'Mars', Wednesday: 'Mercury', Thursday: 'Jupiter', Friday: 'Venus', Saturday: 'Saturn' };

  function dayWindows(d) {
    const { sunrise, sunset } = sunTimes(d);
    const wd = WD[d.getDay()], len = sunset - sunrise, seg = len / 8;
    const win = (s, name, note, tone) => ({ start: sunrise + (s - 1) * seg, end: sunrise + s * seg, name, note, tone });
    const windows = [
      win(RAHU[wd], 'Rahu Kalam', 'no launches, no signing, no big asks', 'red'),
      win(YAMA[wd], 'Yamaganda', 'no new starts, routine ok', 'yellow'),
      win(GULI[wd], 'Gulika', 'no new starts, routine ok', 'yellow'),
    ];
    let abhijit = null;
    if (wd !== 'Wednesday') {
      const noon = sunrise + len / 2, half = len / 30;
      let s = noon - half, e = noon + half;
      const r = windows[0];
      if (e <= r.start || s >= r.end) abhijit = { start: s, end: e };
      else if (s < r.start && r.start - s > 2) abhijit = { start: s, end: r.start };
      else if (e > r.end && e - r.end > 2) abhijit = { start: r.end, end: e };
    }
    return { wd, sunrise, sunset, windows, abhijit };
  }

  function hhmm(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
  const TONE = { red: '#ff8a8a', yellow: '#f6d27a', green: '#8ef0d6', star: '#ffe08a', night: '#c9bde0' };

  function nowState() {
    const d = new Date();
    const info = dayWindows(d);
    const m = d.getHours() * 60 + d.getMinutes();
    let head, sub, tone;
    if (m < info.sunrise || m >= info.sunset) {
      head = 'Night. Rest, plan, no launches';
      sub = m < info.sunrise ? 'Sunrise at ' + hhmm(info.sunrise) : 'Sunrise tomorrow. Today closed at ' + hhmm(info.sunset);
      tone = 'night';
    } else {
      const inW = info.windows.find(w => m >= w.start && m < w.end);
      if (info.abhijit && m >= info.abhijit.start && m < info.abhijit.end) {
        head = 'Abhijit until ' + hhmm(info.abhijit.end); sub = 'best window to send, publish or ask'; tone = 'star';
      } else if (inW) {
        head = inW.name + ' until ' + hhmm(inW.end); sub = inW.note; tone = inW.tone;
      } else {
        const next = info.windows.map(w => w.start).filter(s => s > m).sort((a, b) => a - b)[0];
        head = 'Open until ' + hhmm(next !== undefined ? next : info.sunset);
        sub = info.abhijit && info.abhijit.start > m ? 'Abhijit ' + hhmm(info.abhijit.start) + ' to ' + hhmm(info.abhijit.end) : 'clear stretch, go';
        tone = 'green';
      }
    }
    return { head, sub, tone, wd: info.wd };
  }

  const nowEl = document.getElementById('now');
  let favoured = null;
  function renderNow() {
    const s = nowState();
    const favName = DAY_CLUSTER[s.wd];
    favoured = orbs.find(o => o.userData.cluster.name === favName) || null;
    nowEl.innerHTML = '<b><span class="tone" style="background:' + TONE[s.tone] + '"></span>' + s.head + '</b>' +
      s.sub + '<br>' + s.wd + ' is ' + DAY_LORD[s.wd] + '\u2019s day: ' + favName + ' is lit';
  }

  // Canvas text sprites for thread labels
  function makeLabel(text, colorHex) {
    const pad = 28, fs = 44;
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    ctx.font = '500 ' + fs + 'px Manrope, sans-serif';
    const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
    c.width = w; c.height = fs + pad * 1.4;
    ctx.font = '500 ' + fs + 'px Manrope, sans-serif';
    ctx.fillStyle = 'rgba(20,10,40,0.62)';
    const r = 26; ctx.beginPath();
    ctx.moveTo(r,0); ctx.arcTo(c.width,0,c.width,c.height,r); ctx.arcTo(c.width,c.height,0,c.height,r); ctx.arcTo(0,c.height,0,0,r); ctx.arcTo(0,0,c.width,0,r); ctx.fill();
    ctx.fillStyle = '#f4eefb'; ctx.textBaseline = 'middle';
    ctx.fillText(text, pad, c.height / 2 + 2);
    const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    const scale = 0.0075;
    sp.scale.set(c.width * scale, c.height * scale, 1);
    sp.renderOrder = 10;
    return sp;
  }

  let satGroup = null;
  const satellites = [];
  function spawnSatellites(mesh) {
    clearSatellites();
    const c = mesh.userData.cluster;
    satGroup = new THREE.Group();
    satGroup.position.copy(mesh.position);
    const n = c.threads.length;
    const color = COLORS[c.kind];
    c.threads.forEach((name, i) => {
      // two interleaved rings so long lists stay readable
      const ring = i % 2, count = Math.ceil(n / 2), k = Math.floor(i / 2);
      const a = (k / count) * Math.PI * 2 + ring * (Math.PI / count);
      const radius = mesh.userData.size + 0.75 + ring * 0.55;
      const p = new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius * 0.65, (ring ? -0.25 : 0.25));
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 24),
        new THREE.MeshPhysicalMaterial({ color, emissive: color, emissiveIntensity: 0.5, roughness: 0.3, clearcoat: 1 }));
      s.position.copy(p);
      s.userData = { name, target: p.clone(), label: null };
      s.position.set(0, 0, 0);
      const lab = makeLabel(name, color); lab.position.set(0, 0.2, 0); lab.visible = false; s.add(lab);
      s.userData.label = lab;
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), p]);
      const ln = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 }));
      satGroup.add(ln); satGroup.add(s); satellites.push(s);
    });
    world.add(satGroup);
  }
  function clearSatellites() {
    if (satGroup) { world.remove(satGroup); satGroup = null; }
    satellites.length = 0;
  }

  // Camera glide
  const camTarget = new THREE.Vector3(0, 0, 0);
  let camDist = 7.5;
  const tmpV = new THREE.Vector3();

  // Interaction: drag to rotate, tap to open
  let dragging = false, moved = false, lastX = 0, lastY = 0;
  let velX = 0, velY = 0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    velY = dx * 0.005; velX = dy * 0.005;
    world.rotation.y += velY; world.rotation.x += velX;
    world.rotation.x = Math.max(-0.9, Math.min(0.9, world.rotation.x));
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = e => {
    if (dragging && !moved && e) pick(e.clientX, e.clientY);
    dragging = false;
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', () => { dragging = false; });

  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let selected = null;
  function pick(x, y) {
    ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (satellites.length) {
      const sh = ray.intersectObjects(satellites, false)[0];
      if (sh) { satellites.forEach(s => s.userData.label.visible = (s === sh.object)); return; }
    }
    const hit = ray.intersectObjects(orbs, false)[0];
    if (hit && hit.object !== selected) select(hit.object); else if (!hit) closeSheet();
  }

  const sheet = document.getElementById('sheet');
  const hint = document.getElementById('hint');
  function select(mesh) {
    selected = mesh;
    const c = mesh.userData.cluster;
    document.getElementById('sheetTitle').innerHTML =
      '<span class="dot" style="background:' + CSS[c.kind] + '"></span>' + c.name;
    document.getElementById('sheetCount').textContent = c.threads.length + (c.threads.length === 1 ? ' thread' : ' threads');
    spawnSatellites(mesh);
    camDist = 4.2;
    sheet.classList.add('open');
    hint.style.opacity = 0; nowEl.style.opacity = 0;
  }
  function closeSheet() {
    selected = null;
    clearSatellites();
    camDist = 7.5;
    sheet.classList.remove('open');
    hint.style.opacity = 1; nowEl.style.opacity = 1;
  }
  document.getElementById('closeBtn').addEventListener('click', closeSheet);

  // AR entry (WebXR immersive-ar), only shown where supported
  const arBtn = document.getElementById('arBtn');
  let xrSession = null;
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then(ok => { if (ok) arBtn.style.display = 'inline-block'; }).catch(() => {});
  }
  arBtn.addEventListener('click', async () => {
    if (xrSession) { xrSession.end(); return; }
    try {
      xrSession = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['dom-overlay', 'local-floor'], domOverlay: { root: document.body } });
      xrSession.addEventListener('end', () => {
        xrSession = null; arBtn.textContent = 'View in your room';
        world.position.set(0, 0, 0); world.scale.setScalar(1); stars.visible = true;
      });
      await renderer.xr.setSession(xrSession);
      arBtn.textContent = 'Leave AR';
      stars.visible = false;
      world.scale.setScalar(0.22);
      world.position.set(0, 0, -1.4);
    } catch (err) {
      hint.style.opacity = 1;
      hint.textContent = 'AR could not start on this device. You can still drag and tap here.';
    }
  });

  // Record mode: long-press the title (or anywhere while recording) toggles a clean 12s orbit for Reels
  let recording = false, pressTimer = null;
  function toggleRecord() {
    recording = !recording;
    document.body.classList.toggle('record', recording);
    if (recording) { closeSheet(); nowEl.style.opacity = 0; }
    else { nowEl.style.opacity = 1; }
  }
  const startPress = () => { pressTimer = setTimeout(toggleRecord, 650); };
  const cancelPress = () => { clearTimeout(pressTimer); };
  const titleEl = document.querySelector('.title');
  titleEl.style.pointerEvents = 'auto';
  titleEl.addEventListener('pointerdown', startPress);
  titleEl.addEventListener('pointerup', cancelPress);
  titleEl.addEventListener('pointerleave', cancelPress);
  el.addEventListener('pointerdown', () => { if (recording) startPress(); });
  el.addEventListener('pointerup', cancelPress);

  let entryDone = false;
  const entryStart = performance.now();

  // Animate
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    // Cinematic entry: orbs drift in from stardust over ~1.8s, threads fade in after
    if (!entryDone) {
      const k = Math.min(1, (performance.now() - entryStart) / 1800);
      const ease = 1 - Math.pow(1 - k, 3);
      let allIn = true;
      orbs.forEach(o => {
        const u = o.userData;
        if (!u.entering) return;
        o.position.lerp(u.base, 0.07 + ease * 0.08);
        o.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
        if (o.position.distanceTo(u.base) > 0.02) allIn = false;
      });
      if (k >= 1 && allIn) { entryDone = true; orbs.forEach(o => { o.userData.entering = false; o.position.copy(o.userData.base); }); }
      if (k > 0.7) lineMat.opacity += (0.12 - lineMat.opacity) * 0.05;
      camera.position.z += ((reduceMotion ? 7.5 : 7.5) - camera.position.z) * 0.05;
      if (reduceMotion) { entryDone = true; orbs.forEach(o => { o.userData.entering = false; o.position.copy(o.userData.base); o.scale.setScalar(1); }); lineMat.opacity = 0.12; }
      renderer.render(scene, camera);
      return;
    }
    if (recording && !renderer.xr.isPresenting) {
      // slow cinematic orbit that finishes on today's cluster
      world.rotation.y += 0.0045;
      world.rotation.x += (0.12 - world.rotation.x) * 0.02;
    }
    if (!reduceMotion) {
      orbs.forEach(o => {
        const u = o.userData;
        o.position.y = u.base.y + Math.sin(t * 0.7 + u.phase) * 0.08;
        const s = o === selected ? 1.18 : 1;
        o.scale.lerp(new THREE.Vector3(s, s, s), 0.12);
        o.material.emissiveIntensity = o === selected ? 0.6 : 0.28 + Math.sin(t + u.phase) * 0.05;
        if (o === favoured && !selected) {
          o.material.emissiveIntensity = 0.55 + Math.sin(t * 1.6) * 0.2;
          o.children[0].scale.setScalar(1.15 + Math.sin(t * 1.6) * 0.12);
        } else { o.children[0].scale.setScalar(1); }
        const targetOp = selected && o !== selected ? 0.22 : 0.95;
        o.material.opacity += (targetOp - o.material.opacity) * 0.1;
        o.children[0].material.opacity += ((selected && o !== selected ? 0.02 : 0.09) - o.children[0].material.opacity) * 0.1;
      });
      satellites.forEach(s => s.position.lerp(s.userData.target, 0.1));
      if (satGroup && selected) satGroup.position.copy(selected.position);
      if (!renderer.xr.isPresenting) {
        if (selected) selected.getWorldPosition(tmpV); else tmpV.set(0, 0, 0);
        camTarget.lerp(tmpV, 0.08);
        const want = new THREE.Vector3(camTarget.x * 0.6, camTarget.y * 0.6, camTarget.z + camDist);
        camera.position.lerp(want, 0.08);
        camera.lookAt(camTarget);
      }
      if (!dragging && !renderer.xr.isPresenting) {
        velY *= 0.94; velX *= 0.94;
        world.rotation.y += velY + (selected ? 0 : 0.0012);
        world.rotation.x += velX;
      }
      stars.rotation.y = t * 0.01;
    } else {
      satellites.forEach(s => s.position.copy(s.userData.target));
      if (satGroup && selected) satGroup.position.copy(selected.position);
    }
    renderer.render(scene, camera);
  });

  renderNow(); setInterval(renderNow, 30000);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  }
  boot();
})();
</script>
</body>
</html>
